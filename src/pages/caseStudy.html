      <h4 class="caseStudy__subtitle">Case Study</h4>
      <h1 class="caseStudy__title">

      <div class="caseStudy__text">
        <p>Le projet prend comme base le Design Fiction. Ce dernier représente la pratique de la création de porotypes tangibles et évocateurs dans un possible avenir proche. Cela permet de d’explorer et mettre en lumière les conséquences, néfastes ou non, de ces projets.</p>

        <p>Afin de d’être aider dans la démarche de réflexion, ce projet a commencé tôt dans l’année. Dès octobre 2025, la lecture d’un article de presse, venant du site L’ADN,  et son analyse était demandé toutes les deux semaines. À ce moment, cela ne faisait pas sens mais je remarquait déjà une attirance pour les articles concernant la technologie spatiale et le développement de l’AgTech, branche ultra moderne de l’agriculture moderne. </p>

        <p>Dès lors, début mars, lorsque que j’ai commencé à me pencher sur un sujet pour mon projet de design fiction, une direction me semblait claire. Il fallait que je mèle mes deux sujets préférés d’articles. Cet <a href="https://www.ladn.eu/tech-a-suivre/agriculture-nouvelles-technologies-agtech/" target="_blank">article</a> a marqué un premier pas vers mon sujet de projet. Je pensais alors me lancer dans un projet de comparaison ente l’agriculture industrielle et celle traditionelle, de village.</p>
      </div>

      <div class="caseStudy__caption">
        <h5><span class="underline">Cependant</span>, un évènement marquera un tournant majeur et m’emmènera vers mon sujet final</h5>
      </div>
    </section>

    <section class="projet">
        <h2 class="projet__title">Le Projet</h2>
        <h3 class="projet__subtitle">Historique de vie</h3>

        <div class="projet__text">
            <p>J’ai toujours été passionné par l’agriculture et j’ai eu l’occassion d’en faire mon job étudiant il y a quelques années. J’ai même ramené cette passion chez moi et je me suis mis à élever des poussins, déstinés à la consommation de viande. </p>

            <p>La semaine avant de valider mon sujet définitivement, j’avais accueilli une quinzaines de poussins. Malheuresement, un est décédé dans les jours suivants. Je n’ai pas su comprendre pourquoi et cela m’ennuye énormément à chaque décès.</p>

            <p>Si seulement j’avais pu avoir une caméra ou alors, un quelconque manière d’anticiper. Et si...</p>
        </div>

        <h5 class="projet__bold">Et si mon élevage était connecté à mon téléphone, par capteurs et transmis sur application?</h5>
        
        <div class="caseStudy__caption">
            <h5><span class="underline">Et si</span>l’éleveur avait une application qui le permet de suivre la santé de ses bêtes?</h5>
        </div>

        <div class="projet__text">
            <p>Je me suis lancé dans la création d’un univers où les exploitations agricoles sont consultables sur une application. Ce sujet très précis reste assez large paradoxalement. Je me concentre donc sur un projet autour de l’élevage. </p>
        </div>

        <h3 class="projet__subtitle">Au final</h3>
        
        <div class="projet__text">
            <p>Par caméra, implant, capteur en général, les bêtes sont analysés selon leur déplacement, respiration, contraction, hydratation, alimentation, etc. Et le tout se retrouve dans une application; la ferme devient connectée.</p>
        </div>

        <h5 class="projet__bold">Cette application se prénomme FarmSync.</h5>
        
        <h3 class="projet__subtitle">Soucis?</h3>
        
        <div class="projet__text">
            <p>Mon principal soucis de conception n’était pas de trouver du contenu, qui m’est venu assez facilement, mais bien de comment l’articuler autour de l’application. Je ne voulais pas créer un site de e-commerce ou encore, une simple newsletter.</p>

            <p>La présentation de l’application se structure autour de 4 cas de figures dans lesquels les bienfaits sont présentés au même titre que les problématiques </p>
            
            <p>La meilleure façon d’exposer ces derniers est par le biais d’un syndicat ou autre moderne, à l’esprit critque et proche du terrain. C’est là qu’entre en jeu Deep Root, un collectif d’agriculteurs fan de AgTech.</p>
        </div>

        <h5 class="projet__bold underline">Deep Root est la pierre angulaire de ce projet</h5>
    </section>

    <section class="design">
        <h2 class="design__title">Du Design</h2>
        <div class="design__text">
            <p>La partie design de ce projet est la parti qui m'a pris le plus de temps, en comparaison avec l'écriture du contenu et l'intégration. Ce n'est pas la partie que je trouve la plus intuitive à aborder pour moi, je préfère le code. Cela dit, je remarque qu'avec un bon prototypage, l'intégration devient beaucoup plus fluide.</p>
        </div>

        <h5 class="design__subtitle">Des couleurs</h5>
        <div class="design__text">
            <p>Pour Deep Root, je suis parti sur une palette de couleurs naturelles afin de refléter au mieux l’agriculture et l'environnement rural. Un blanc, un peu jaune, rappelant la paille auquel j'ajoute deux nuances de vert.</p>
            <p>J'ai souhaité utilisé des couleurs d'accentuation selon les cas afin d'éviter une certaine monotonie.</p>
        </div>

        <img src="#" alt="Palette de couleurs de Deep Root" class="design__img">

        <div class="design__text">
            <p>Pour FamSync, qu'on ne voit qu'au travers de mockups, je suis parti su une pallete simple; une nuance de blanc et une de noir. À cela, j'ai ajouté des couleurs d'accentuation selon la gravité du message transmis.</p>
        </div>

        <img src="#" alt="Palette de couleurs de FarmSync" class="design__img">

        <h5 class="design__subtitle">Des polices</h5>
        <div class="design__text">
            <p>Pour Deep Root, j'ai tout d'abord utilisé Sora comme police pour les titres car je cherchais une police moderne et lisible, tout en gardant un impact marquant.</p>
            <p>En contrepartie, pour le texte, j'ai opté pour une police plus carrée tout en restant facile à lire, afin de faire resortir les titres.</p>
        </div>

        <img src="#" alt="Polices de Deep Root" class="design__img">

        <div class="design__text">
            <p>Pour FamSync, j'ai utilisé JetBrains Mono pour les textes pour sa typographie assez carré, rappelant une ligne de code. Le but était de rester proche d'un univers très tech, très IA, mais la lisibilité reste importante afin d'aller droit à l'information.</p>
            <p>Enfin pour le peu de titres, j'ai utilisé une police plus simple, lisible et sur la rondeur; Ricordi Greto de TypeType.</p>
        </div>

        <img src="#" alt="Polices de FarmSync" class="design__img">
    </section>

    <section class="code">
        <h2 class="code__title">Du Code</h2>

        <div class="code__text">
            <p>Pour la partie d'intégration, je n'ai pas eu vraiment de difficulté. J'avancais de manière progressive et méthodique. L'utilisation de SCSS m'a permis d'organiser mes styles d'une meilleure façon, il m'a fallu un temps d'adaptation car c'est mon premier projet avec ce preprocessor. Je pense qu'il ya un certain nombre de choses que je pourrais améliorer dans mes futurs projets.</p>

            <p>Concernant le JavaScript, il gère trois fonctionnalités clés : l'ouverture et la fermeture du burger menu, l'effet de scroll back du header et un compteur animé qui se déclenche lorsque l'élément devient visible à l'écran.</p>
        </div>
    </section>
